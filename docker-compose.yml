services:
    postgres-db:
        image: postgres:15-alpine
        container_name: postgres-db
        restart: always
        env_file: ./.env
        ports:
          - "5433:5432"
        volumes:
          - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5
    tic-engine-etl:
        image: tic-engine-etl
        build: .
        container_name: tic-engine-etl
        env_file: ./.env

        depends_on:
            postgres-db:
                condition: service_healthy
        volumes:
            - ./src:/app/src
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    postgres_data:
        name: postgres_data
    
